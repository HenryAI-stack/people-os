<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PeopleOS — Leadership Hub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
    <!-- PWA: installable from the phone's browser (manifest + service worker, see src/lib/pwa.js) -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#1b1f26" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PeopleOS" />
    <!-- No apple-mobile-web-app-status-bar-style on purpose: "black-translucent" puts the page under
         the status bar, and since iOS 26 the installed app then gets a Liquid Glass blur over its top
         ~40pt (the first line looked blurry). The default style gives a solid status bar tinted from
         theme-color (App.jsx switches it with the light/dark theme) and starts the page below it. -->
    <script>
      (function() {
        var r = sessionStorage.getItem('gh-pages-redirect');
        if (r) { sessionStorage.removeItem('gh-pages-redirect'); var u = new URL(r); window.history.replaceState(null,'',u.pathname+u.search+u.hash); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot watchdog: if the app's own script fails to load (a cached page pointing at files a newer
         deploy removed) or nothing has rendered after 15s, drop the service worker + its caches and
         load the page fresh from the network (?r= skips the HTTP cache too). At most once a minute,
         so a real outage can't loop. Plain ES5 on purpose: it must run even when the bundle can't. -->
    <script>
      (function () {
        var KEY = 'peopleos-boot-recover';
        function recover() {
          try {
            if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 60000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          var jobs = [];
          if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.filter(function (k) { return k.indexOf('peopleos-') === 0; }).map(function (k) { return caches.delete(k); }));
          }));
          Promise.all(jobs).catch(function () {}).then(function () {
            location.replace(location.pathname + '?r=' + Date.now() + location.hash);
          });
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) recover();
        }, true);
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.firstChild) recover();
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
